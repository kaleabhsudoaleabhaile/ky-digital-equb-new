<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Y Digital Equb - Live ዕጣ ማውጫ</title>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --card-bg: #1b263b;
      --accent-color: #f5a623;
      --text-color: #e0e1dd;
      --success-color: #2ec4b6;
      --blue-btn: #1d72b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .main-title {
      color: #3a86ff;
      font-size: 26px;
      margin-bottom: 5px;
      cursor: pointer;
      user-select: none;
    }

    .sub-title {
      color: #778da9;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .dashed-card {
      border: 2px dashed #3a86ff;
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .btn-share {
      background-color: var(--blue-btn);
      color: #fff;
      font-size: 15px;
      margin-top: 10px;
      text-decoration: none;
      display: none; /* ዕጣ ሲወጣ ብቻ ይታያል */
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn-spin {
      background-color: var(--success-color);
      color: #fff;
      font-size: 18px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .btn-add {
      background-color: #3a86ff;
      color: #fff;
      font-size: 14px;
      padding: 10px;
      margin-top: 8px;
    }

    .status-text {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      margin: 15px 0;
    }

    .wheel-container {
      position: relative;
      margin: 15px auto;
      width: 260px;
      height: 260px;
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid var(--accent-color);
      z-index: 10;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #415a77;
      padding: 6px 2px;
      text-align: center;
    }

    th {
      background-color: #0d1b2a;
      color: var(--accent-color);
    }

    input[type="checkbox"] {
      transform: scale(1.2);
    }

    .user-readonly input[type="checkbox"] {
      pointer-events: none;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #415a77;
      background-color: #0d1b2a;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ርዕሱን 3 ጊዜ በመንካት በአድሚንነት መግባት -->
  <h1 class="main-title" onclick="handleTitleClick()">🏆 K Y Digital Equb 🏆</h1>
  <div class="sub-title">የዕቁብ Live ዕጣ ማውጫ ገፅ</div>

  <!-- የአድሚን መቆጣጠሪያ ፓነል -->
  <div id="admin-controls" class="card" style="display: none; border: 1px solid var(--accent-color);">
    <p style="color: var(--success-color); margin-top: 0; font-size: 15px;"><b>⚙️ የአድሚን መቆጣጠሪያ ፓነል</b></p>
    
    <!-- አባል መመዝገቢያ ፎርም -->
    <div style="margin-bottom: 12px; text-align: left;">
      <label style="font-size: 13px; color: #778da9;">አዲስ አባል ስም አስገባ:</label>
      <input type="text" id="new-member-name" class="input-field" placeholder="የተማሪውን ስም ጻፍ...">
      
      <label style="font-size: 13px; color: #778da9; margin-top: 8px; display: block;">ፆታ መርዝ:</label>
      <select id="new-member-gender" class="select-field">
        <option value="ወንድ">ወንድ</option>
        <option value="ሴት">ሴት</option>
      </select>

      <button class="btn btn-add" onclick="addNewMember()">➕ አባል ጨምር</button>
    </div>

    <button class="btn btn-spin" onclick="triggerSpin()">🎲 ዕጣ አውጣ (Spin)</button>
    
    <!-- ወደ ቴሌግራም ቻናል ሼር ማድረጊያ -->
    <a id="share-btn" href="#" target="_blank" class="btn-share">
      📥 ውጤቱን ወደ ቴሌግራም ቻናል ሼር አድርግ
    </a>
  </div>

  <!-- የዕጣ ማውጫ ቦታ -->
  <div class="card dashed-card">
    <h3 style="color: #3a86ff; margin-top: 0;">🏆 የቀን (Live) ዕጣ ማውጣት</h3>

    <div id="status-display" class="status-text">ዕጣ ለመጀመር ዝግጁ ነው</div>

    <div id="wheel-box" class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="260" height="260"></canvas>
    </div>
  </div>

  <!-- የአባላት ሰንጠረዥ (ለሁሉም ይታያል) -->
  <div class="card">
    <h3 style="color: #3a86ff; margin-top: 0;">የአባላት ዝርዝር እና የ 5 ቀናት ክፍያ (50 ብር)</h3>
    <div id="table-wrapper" class="user-readonly">
      <table>
        <thead>
          <tr>
            <th>ስም</th>
            <th>ፆታ</th>
            <th>ቀን 1</th>
            <th>ቀን 2</th>
            <th>ቀን 3</th>
            <th>ቀን 4</th>
            <th>ቀን 5</th>
            <th>ሁኔታ</th>
          </tr>
        </thead>
        <tbody id="members-body">
          <!-- አባላት ይጫናሉ -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let isAdmin = false;
  let clickCount = 0;
  let clickTimer = null;

  function handleTitleClick() {
    clickCount++;
    if (clickCount === 1) {
      clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
    } else if (clickCount === 3) {
      clearTimeout(clickTimer);
      clickCount = 0;
      const pass = prompt("እባክዎን የአድሚን ይለፍ ቃል (Password) ያስገቡ:");
      if (pass === "182418") {
        isAdmin = true;
        document.getElementById('admin-controls').style.display = 'block';
        document.getElementById('table-wrapper').classList.remove('user-readonly');
        alert("በአድሚንነት በስኬት ገብተዋል!");
      } else {
        alert("የተሳሳተ ይለፍ ቃል!");
      }
    }
  }

  let members = JSON.parse(localStorage.getItem('ky_members')) || [];

  function saveMembers() {
    localStorage.setItem('ky_members', JSON.stringify(members));
    renderTable();
  }

  function addNewMember() {
    if (!isAdmin) return;
    const nameInput = document.getElementById('new-member-name');
    const genderInput = document.getElementById('new-member-gender');
    const name = nameInput.value.trim();
    const gender = genderInput.value;

    if (!name) {
      alert("እባክዎን ስም ያስገቡ!");
      return;
    }
    members.push({ name: name, gender: gender, days: [false, false, false, false, false], paid: false });
    nameInput.value = '';
    saveMembers();
  }

  function renderTable() {
    const tbody = document.getElementById('members-body');
    tbody.innerHTML = '';
    
    if (members.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="color: #778da9; padding: 15px;">ምንም አባላት የሉም (በአድሚን ይጨመራሉ)</td></tr>`;
      return;
    }

    members.forEach((m, idx) => {
      const allDaysChecked = m.days.every(d => d === true);
      m.paid = allDaysChecked;

      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${m.name}</b></td>
        <td><small>${m.gender || 'ወንድ'}</small></td>
        ${m.days.map((d, dayIdx) => `<td><input type="checkbox" ${d ? 'checked' : ''} onchange="toggleDay(${idx},${dayIdx})"></td>`).join('')}
        <td><span style="color: ${m.paid ? '#2ec4b6' : '#e63946'}">${m.paid ? 'ተከፍሏል' : 'አልተከፈለም'}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleDay(memberIdx, dayIdx) {
    if (!isAdmin) return;
    members[memberIdx].days[dayIdx] = !members[memberIdx].days[dayIdx];
    saveMembers();
  }

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const colors = ['#f5a623', '#3a86ff', '#2ec4b6', '#e63946', '#9d4edd'];
  let startAngle = 0;

  function drawWheel() {
    if (members.length === 0) return;
    const numOptions = members.length;
    const arcSize = (2 * Math.PI) / numOptions;
    ctx.clearRect(0, 0, 260, 260);

    members.forEach((m, i) => {
      const angle = startAngle + i * arcSize;
      ctx.beginPath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(130, 130);
      ctx.arc(130, 130, 120, angle, angle + arcSize);
      ctx.lineTo(130, 130);
      ctx.fill();

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.translate(130 + Math.cos(angle + arcSize / 2) * 75, 130 + Math.sin(angle + arcSize / 2) * 75);
      ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(m.name, -ctx.measureText(m.name).width / 2, 0);
      ctx.restore();
    });
  }

  window.addEventListener('storage', (e) => {
    if (e.key === 'ky_spin_data') {
      const data = JSON.parse(e.newValue);
      startLiveSpin(data.targetAngle, data.winner, data.gender);
    }
    if (e.key === 'ky_members') {
      members = JSON.parse(e.newValue);
      renderTable();
      drawWheel();
    }
  });

  function triggerSpin() {
    if (!isAdmin) return;
    if (members.length === 0) {
      alert("እባክዎን መጀመሪያ አባሎችን ያስገቡ!");
      return;
    }

    const eligibleMembers = members.filter(m => m.days.every(d => d === true));
    
    if (eligibleMembers.length === 0) {
      alert("⚠️ 5ቱንም ቀናት ክፍያ (ቲክ) ያላጠናቀቀ አባል ስላለ ዕጣ ማውጣት አይቻልም! (ሁሉም 5 ቀናት መሞላት አለባቸው)");
      return;
    }

    const randomWinnerIndex = Math.floor(Math.random() * eligibleMembers.length);
    const winnerObj = eligibleMembers[randomWinnerIndex];
    const originalIndex = members.findIndex(m => m.name === winnerObj.name);

    const arcSize = 360 / members.length;
    const targetAngle = 360 * 5 + (360 - (originalIndex * arcSize + arcSize / 2));
    
    const spinData = {
      targetAngle: targetAngle,
      winner: winnerObj.name,
      gender: winnerObj.gender || 'ወንድ',
      time: Date.now()
    };
    localStorage.setItem('ky_spin_data', JSON.stringify(spinData));
    startLiveSpin(targetAngle, winnerObj.name, winnerObj.gender || 'ወንድ');
  }

  function startLiveSpin(targetDegrees, winnerName, winnerGender) {
    document.getElementById('wheel-box').style.display = 'block';
    document.getElementById('status-display').innerHTML = "🎲 ዕጣ በመውጣት ላይ ነው...";

    let currentDeg = 0;
    let spinDuration = 4000;
    let startTime = null;

    function step(timestamp) {
      if (!startTime) startTime = timestamp;
      let progress = timestamp - startTime;
      let ease = 1 - Math.pow(1 - Math.min(progress / spinDuration, 1), 3);
      currentDeg = targetDegrees * ease;
      
      startAngle = (currentDeg * Math.PI) / 180;
      drawWheel();

      if (progress < spinDuration) {
        requestAnimationFrame(step);
      } else {
        document.getElementById('status-display').innerHTML = `🎉 አሸናፊ፦ <b>${winnerName}</b> 🏆`;

        if (isAdmin) {
          // እንደ ፆታቸው እንኳን ደስ አለህ / አለሽ የማዘጋጀት አሰራር
          const congratMsg = (winnerGender === 'ሴት') ? "እንኳን ደስ አለሽ!" : "እንኳን ደስ አለህ!";
          
          const shareText = `🎉 *K Y Digital Equb - Live Draw Result* 🎉\n\nየዚህ ዙር ዕጣ አሸናፊ:\n👤 የዚህ ዙር ዕጣ የወጣለት: *${winnerName}*\n💵 የዕቁብ ክፍያ መጠን: 50 ብር\n🏆 አጠቃላይ ድምር: 25,000 ብር\n\n💳 ለዕቁብ አባላት ብቻ የብድር አገልግሎት እንመቻቻለን::\n\n${congratMsg} 🎊 K Y Digital Equb`;
          
          const telegramUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(shareText)}`;
          
          const shareBtn = document.getElementById('share-btn');
          shareBtn.href = telegramUrl;
          shareBtn.style.display = 'block';
        }
      }
    }
    requestAnimationFrame(step);
  }

  renderTable();
  drawWheel();
</script>

</body>
</html>
