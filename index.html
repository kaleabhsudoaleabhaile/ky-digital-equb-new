<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Y Digital Equb - Live ዕጣ ማውጫ</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-color: #0d1b2a;
      --card-bg: #1b263b;
      --accent-color: #f5a623;
      --text-color: #e0e1dd;
      --success-color: #2ec4b6;
      --blue-btn: #1d72b8;
      --danger-color: #e63946;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 550px;
      margin: 0 auto;
    }

    .main-title {
      color: #3a86ff;
      font-size: 26px;
      margin-bottom: 5px;
      cursor: pointer;
      user-select: none;
    }

    .sub-title {
      color: #778da9;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .dashed-card {
      border: 2px dashed #3a86ff;
      padding: 25px 15px;
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .btn-share {
      background-color: var(--blue-btn);
      color: #fff;
      font-size: 15px;
      margin-top: 10px;
      text-decoration: none;
      display: none;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn-spin {
      background-color: var(--success-color);
      color: #fff;
      font-size: 18px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .btn-add {
      background-color: #3a86ff;
      color: #fff;
      font-size: 14px;
      padding: 10px;
      margin-top: 8px;
    }

    .btn-action {
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin: 2px;
    }
    .btn-edit { background-color: #f5a623; color: #000; }
    .btn-delete { background-color: #e63946; color: #fff; }

    .status-text {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
      margin: 15px 0;
    }

    .shuffle-box {
      font-size: 28px;
      font-weight: bold;
      color: #3a86ff;
      background-color: #0d1b2a;
      border: 2px solid var(--accent-color);
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
      min-height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #415a77;
      padding: 6px 2px;
      text-align: center;
    }

    th {
      background-color: #0d1b2a;
      color: var(--accent-color);
    }

    input[type="checkbox"] {
      transform: scale(1.2);
    }

    .user-readonly input[type="checkbox"] {
      pointer-events: none;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #415a77;
      background-color: #0d1b2a;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ርዕሱን 3 ጊዜ ስትነካው የአድሚን መግቢያ ይከፈታል -->
  <h1 class="main-title" onclick="handleTitleClick()">🏆 K Y Digital Equb 🏆</h1>
  <div class="sub-title">የዕቁብ Live ዕጣ ማውጫ ገፅ</div>

  <!-- የአድሚን መቆጣጠሪያ ፓነል -->
  <div id="admin-controls" class="card" style="display: none; border: 1px solid var(--accent-color);">
    <p style="color: var(--success-color); margin-top: 0; font-size: 15px;"><b>⚙️ የአድሚን መቆጣጠሪያ ፓነል</b></p>
    
    <div style="margin-bottom: 12px; text-align: left;">
      <label style="font-size: 13px; color: #778da9;">አዲስ አባል ስም አስገባ:</label>
      <input type="text" id="new-member-name" class="input-field" placeholder="የተማሪውን ስም ጻፍ...">
      
      <label style="font-size: 13px; color: #778da9; margin-top: 8px; display: block;">ፆታ መረጥ:</label>
      <select id="new-member-gender" class="select-field">
        <option value="ወንድ">ወንድ</option>
        <option value="ሴት">ሴት</option>
      </select>

      <button class="btn btn-add" onclick="addNewMember()">➕ አባል ጨምር</button>
    </div>

    <button class="btn btn-spin" onclick="triggerSpin()">🎲 ዕጣ አውጣ (Spin)</button>
    
    <a id="share-btn" href="#" class="btn-share" onclick="shareToTelegram(event)">
      📥 ውጤቱን ወደ ቴሌግራም ቻናል ሼር አድርግ
    </a>
  </div>

  <!-- የዕጣ ማውጫ ቦታ -->
  <div class="card dashed-card">
    <h3 style="color: #3a86ff; margin-top: 0;">🏆 የቀን (Live) ዕጣ ማውጣት</h3>

    <div id="status-display" class="status-text">ዕጣ ለመጀመር ዝግጁ ነው</div>

    <div id="shuffle-display" class="shuffle-box">🎲 K Y EQUB 🎲</div>
  </div>

  <!-- የአባላት ሰንጠረዥ -->
  <div class="card">
    <h3 style="color: #3a86ff; margin-top: 0;">የአባላት ዝርዝር እና የ 5 ቀናት ክፍያ (50 ብር)</h3>
    <div id="table-wrapper" class="user-readonly">
      <table>
        <thead>
          <tr>
            <th>ስም</th>
            <th>ፆታ</th>
            <th>ቀን 1</th>
            <th>ቀን 2</th>
            <th>ቀን 3</th>
            <th>ቀን 4</th>
            <th>ቀን 5</th>
            <th>ሁኔታ</th>
            <th id="action-header" style="display: none;">እርምጃ</th>
          </tr>
        </thead>
        <tbody id="members-body">
          <!-- አባላት በኦንላይን ዳታቤዝ ይጫናሉ -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // 🔥 Firebase Configuration
  const firebaseConfig = {
    databaseURL: "https://ky-digital-equb-default-rtdb.firebaseio.com/"
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  let isAdmin = false;
  let clickCount = 0;
  let clickTimer = null;
  let currentShareText = "";
  let lastSpinTime = 0;
  let members = [];

  // ርዕሱን 3 ጊዜ ስትነካ አድሚን መግቢያ ይከፍታል
  function handleTitleClick() {
    clickCount++;
    if (clickCount === 1) {
      clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
    } else if (clickCount === 3) {
      clearTimeout(clickTimer);
      clickCount = 0;
      const pass = prompt("እባክዎን የአድሚን ይለፍ ቃል (Password) ያስገቡ:");
      if (pass === "182418") {
        isAdmin = true;
        document.getElementById('admin-controls').style.display = 'block';
        document.getElementById('action-header').style.display = 'table-cell';
        document.getElementById('table-wrapper').classList.remove('user-readonly');
        renderTable();
        alert("በአድሚንነት በስኬት ገብተዋል!");
      } else {
        alert("የተሳሳተ ይለፍ ቃል!");
      }
    }
  }

  // 🌐 🔥 Real-time Cloud Listeners (በሁሉም ስልክ ላይ መረጃዎችን በኦንላይን የሚያስተላልፍ)
  db.ref('ky_equb/members').on('value', (snapshot) => {
    const data = snapshot.val();
    members = data ? data : [];
    renderTable();
  });

  db.ref('ky_equb/spinEvent').on('value', (snapshot) => {
    const spinData = snapshot.val();
    if (spinData && spinData.time > lastSpinTime) {
      lastSpinTime = spinData.time;
      startLiveSpin(spinData.winner, spinData.gender, spinData.winnerIdx);
    }
  });

  function saveMembersToCloud() {
    db.ref('ky_equb/members').set(members);
  }

  function addNewMember() {
    if (!isAdmin) return;
    const nameInput = document.getElementById('new-member-name');
    const genderInput = document.getElementById('new-member-gender');
    const name = nameInput.value.trim();
    const gender = genderInput.value;

    if (!name) {
      alert("እባክዎን ስም ያስገቡ!");
      return;
    }
    members.push({ name: name, gender: gender, days: [false, false, false, false, false], hasWon: false });
    nameInput.value = '';
    saveMembersToCloud();
  }

  function editMember(idx) {
    if (!isAdmin) return;
    const newName = prompt("አዲሱን የአባል ስም ያስገቡ:", members[idx].name);
    if (newName && newName.trim() !== "") {
      members[idx].name = newName.trim();
      saveMembersToCloud();
    }
  }

  function deleteMember(idx) {
    if (!isAdmin) return;
    if (confirm(`በእርግጥ ${members[idx].name} ከዕቁብ ዝርዝር ይወገድ?`)) {
      members.splice(idx, 1);
      saveMembersToCloud();
    }
  }

  function renderTable() {
    const tbody = document.getElementById('members-body');
    tbody.innerHTML = '';
    
    if (!members || members.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="color: #778da9; padding: 15px;">ምንም አባላት የሉም (በአድሚን ይጨመራሉ)</td></tr>`;
      return;
    }

    members.forEach((m, idx) => {
      let mDays = m.days || [false, false, false, false, false];
      let allDaysPaid = mDays.every(d => d === true);
      let statusText = m.hasWon ? 'ዕጣ የወጣለት' : (allDaysPaid ? 'ተከፍሏል' : 'አልተከፈለም');
      let statusColor = m.hasWon ? '#f5a623' : (allDaysPaid ? '#2ec4b6' : '#e63946');

      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${m.name}</b></td>
        <td><small>${m.gender || 'ወንድ'}</small></td>
        ${mDays.map((d, dayIdx) => `<td><input type="checkbox" ${d ? 'checked' : ''} onchange="toggleDay(${idx},${dayIdx})"></td>`).join('')}
        <td><span style="color: ${statusColor}; font-weight: bold;">${statusText}</span></td>
        ${isAdmin ? `<td>
          <button class="btn-action btn-edit" onclick="editMember(${idx})">✏️</button>
          <button class="btn-action btn-delete" onclick="deleteMember(${idx})">🗑️</button>
        </td>` : ''}
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleDay(memberIdx, dayIdx) {
    if (!isAdmin) return;
    if (!members[memberIdx].days) {
      members[memberIdx].days = [false, false, false, false, false];
    }
    members[memberIdx].days[dayIdx] = !members[memberIdx].days[dayIdx];
    saveMembersToCloud();
  }

  function triggerSpin() {
    if (!isAdmin) return;
    if (!members || members.length === 0) {
      alert("እባክዎን መጀመሪያ አባሎችን ያስገቡ!");
      return;
    }

    const activeMembers = members.filter(m => !m.hasWon);
    
    if (activeMembers.length === 0) {
      alert("⚠️ ሁሉም አባላት ዕጣ አውጥተው ጨርሰዋል!");
      return;
    }

    const allActivePaid = activeMembers.every(m => (m.days || []).every(d => d === true));
    
    if (!allActivePaid) {
      alert("⚠️ ዕጣ ማውጣት አይቻልም! ሁሉም አባላት የ 5ቱንም ቀናት ክፍያ (ቲክ) ሙሉ በሙሉ ማጠናቀቅ አለባቸው።");
      return;
    }

    const randomWinnerIndex = Math.floor(Math.random() * activeMembers.length);
    const winnerObj = activeMembers[randomWinnerIndex];
    const originalIndex = members.findIndex(m => m.name === winnerObj.name);

    const spinData = {
      winner: winnerObj.name,
      gender: winnerObj.gender || 'ወንድ',
      winnerIdx: originalIndex,
      time: Date.now()
    };

    // 🔥 በኦንላይን ዳታቤዝ ወደ ሁሉም ስልኮች የ Spin ምልክቱን መላክ
    db.ref('ky_equb/spinEvent').set(spinData);
  }

  function startLiveSpin(winnerName, winnerGender, winnerIdx) {
    document.getElementById('status-display').innerHTML = "🎲 ዕጣ በመውጣት ላይ ነው...";
    const shuffleBox = document.getElementById('shuffle-display');

    const activeMembers = members.filter(m => !m.hasWon);
    let counter = 0;
    
    const interval = setInterval(() => {
      const randomName = activeMembers.length > 0 ? activeMembers[Math.floor(Math.random() * activeMembers.length)].name : winnerName;
      shuffleBox.innerHTML = randomName;
      counter++;

      if (counter > 30) {
        clearInterval(interval);
        shuffleBox.innerHTML = `🎉 ${winnerName} 🎉`;
        document.getElementById('status-display').innerHTML = `🎉 አሸናፊ፦ <b>${winnerName}</b> 🏆`;

        if (isAdmin) {
          if (members[winnerIdx]) {
            members[winnerIdx].hasWon = true;
          }

          members.forEach(m => {
            m.days = [false, false, false, false, false];
          });
          
          saveMembersToCloud();

          const congratMsg = (winnerGender === 'ሴት') ? "እንኳን ደስ አለሽ!" : "እንኳን ደስ አለህ!";
          
          currentShareText = `🎉 *K Y Digital Equb - Live Draw Result* 🎉\n\nየዚህ ዙር ዕጣ አሸናፊ:\n👤 የዚህ ዙር ዕጣ የወጣለት: *${winnerName}*\n💵 የዕቁብ ክፍያ መጠን: 50 ብር\n🏆 አጠቃላይ ድምር: 25,000 ብር\n\n💳 ለዕቁብ አባላት ብቻ የብድር አገልግሎት እናመቻቻለን::\n\n${congratMsg} 🎊 K Y Digital Equb`;
          
          document.getElementById('share-btn').style.display = 'block';
        }
      }
    }, 100);
  }

  function shareToTelegram(e) {
    e.preventDefault();
    if (!currentShareText) return;
    
    const tgDirectUrl = `tg://msg_url?url=&text=${encodeURIComponent(currentShareText)}`;
    const tgWebUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(currentShareText)}`;

    window.location.href = tgDirectUrl;
    setTimeout(() => {
      window.open(tgWebUrl, '_blank');
    }, 1000);
  }

  renderTable();
</script>

</body>
</html>
