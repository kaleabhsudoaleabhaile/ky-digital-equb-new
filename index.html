<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Y Digital Equb - Live ዕጣ ማውጫ</title>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --card-bg: #1b263b;
      --accent-color: #f5a623;
      --text-color: #e0e1dd;
      --success-color: #2ec4b6;
      --blue-btn: #1d72b8;
      --danger-color: #e63946;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 550px;
      margin: 0 auto;
    }

    .main-title {
      color: #3a86ff;
      font-size: 26px;
      margin-bottom: 5px;
      cursor: pointer;
      user-select: none;
    }

    .sub-title {
      color: #778da9;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .dashed-card {
      border: 2px dashed #3a86ff;
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .btn-share {
      background-color: var(--blue-btn);
      color: #fff;
      font-size: 15px;
      margin-top: 10px;
      text-decoration: none;
      display: none;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn-spin {
      background-color: var(--success-color);
      color: #fff;
      font-size: 18px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .btn-add {
      background-color: #3a86ff;
      color: #fff;
      font-size: 14px;
      padding: 10px;
      margin-top: 8px;
    }

    .btn-action {
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin: 2px;
    }
    .btn-edit { background-color: #f5a623; color: #000; }
    .btn-delete { background-color: #e63946; color: #fff; }

    .status-text {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      margin: 15px 0;
    }

    .wheel-container {
      position: relative;
      margin: 15px auto;
      width: 280px;
      height: 280px;
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(245, 166, 35, 0.4);
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 28px solid #ff4757;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #415a77;
      padding: 6px 2px;
      text-align: center;
    }

    th {
      background-color: #0d1b2a;
      color: var(--accent-color);
    }

    input[type="checkbox"] {
      transform: scale(1.2);
    }

    .user-readonly input[type="checkbox"] {
      pointer-events: none;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #415a77;
      background-color: #0d1b2a;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="main-title" onclick="handleTitleClick()">🏆 K Y Digital Equb 🏆</h1>
  <div class="sub-title">የዕቁብ Live ዕጣ ማውጫ ገፅ</div>

  <!-- የአድሚን መቆጣጠሪያ ፓነል -->
  <div id="admin-controls" class="card" style="display: none; border: 1px solid var(--accent-color);">
    <p style="color: var(--success-color); margin-top: 0; font-size: 15px;"><b>⚙️ የአድሚን መቆጣጠሪያ ፓነል</b></p>
    
    <div style="margin-bottom: 12px; text-align: left;">
      <label style="font-size: 13px; color: #778da9;">አዲስ አባል ስም አስገባ:</label>
      <input type="text" id="new-member-name" class="input-field" placeholder="የተማሪውን ስም ጻፍ...">
      
      <label style="font-size: 13px; color: #778da9; margin-top: 8px; display: block;">ፆታ መረጥ:</label>
      <select id="new-member-gender" class="select-field">
        <option value="ወንድ">ወንድ</option>
        <option value="ሴት">ሴት</option>
      </select>

      <button class="btn btn-add" onclick="addNewMember()">➕ አባል ጨምር</button>
    </div>

    <button class="btn btn-spin" onclick="triggerSpin()">🎲 ዕጣ አውጣ (Spin)</button>
    
    <a id="share-btn" href="#" class="btn-share" onclick="shareToTelegram(event)">
      📥 ውጤቱን ወደ ቴሌግራም ቻናል ሼር አድርግ
    </a>
  </div>

  <!-- የዕጣ ማውጫ ቦታ -->
  <div class="card dashed-card">
    <h3 style="color: #3a86ff; margin-top: 0;">🏆 የቀን (Live) ዕጣ ማውጣት</h3>

    <div id="status-display" class="status-text">ዕጣ ለመጀመር ዝግጁ ነው</div>

    <div id="wheel-box" class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="280" height="280"></canvas>
    </div>
  </div>

  <!-- የአባላት ሰንጠረዥ -->
  <div class="card">
    <h3 style="color: #3a86ff; margin-top: 0;">የአባላት ዝርዝር እና የ 5 ቀናት ክፍያ (50 ብር)</h3>
    <div id="table-wrapper" class="user-readonly">
      <table>
        <thead>
          <tr>
            <th>ስም</th>
            <th>ፆታ</th>
            <th>ቀን 1</th>
            <th>ቀን 2</th>
            <th>ቀን 3</th>
            <th>ቀን 4</th>
            <th>ቀን 5</th>
            <th>ሁኔታ</th>
            <th id="action-header" style="display: none;">እርምጃ</th>
          </tr>
        </thead>
        <tbody id="members-body">
          <!-- አባላት ይጫናሉ -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let isAdmin = false;
  let clickCount = 0;
  let clickTimer = null;
  let currentShareText = "";

  function handleTitleClick() {
    clickCount++;
    if (clickCount === 1) {
      clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
    } else if (clickCount === 3) {
      clearTimeout(clickTimer);
      clickCount = 0;
      const pass = prompt("እባክዎን የአድሚን ይለፍ ቃል (Password) ያስገቡ:");
      if (pass === "182418") {
        isAdmin = true;
        document.getElementById('admin-controls').style.display = 'block';
        document.getElementById('action-header').style.display = 'table-cell';
        document.getElementById('table-wrapper').classList.remove('user-readonly');
        renderTable();
        alert("በአድሚንነት በስኬት ገብተዋል!");
      } else {
        alert("የተሳሳተ ይለፍ ቃል!");
      }
    }
  }

  let members = JSON.parse(localStorage.getItem('ky_members')) || [];

  function saveMembers() {
    localStorage.setItem('ky_members', JSON.stringify(members));
    renderTable();
    drawWheel();
  }

  function addNewMember() {
    if (!isAdmin) return;
    const nameInput = document.getElementById('new-member-name');
    const genderInput = document.getElementById('new-member-gender');
    const name = nameInput.value.trim();
    const gender = genderInput.value;

    if (!name) {
      alert("እባክዎን ስም ያስገቡ!");
      return;
    }
    members.push({ name: name, gender: gender, days: [false, false, false, false, false], hasWon: false });
    nameInput.value = '';
    saveMembers();
  }

  function editMember(idx) {
    if (!isAdmin) return;
    const newName = prompt("አዲሱን የአባል ስም ያስገቡ:", members[idx].name);
    if (newName && newName.trim() !== "") {
      members[idx].name = newName.trim();
      saveMembers();
    }
  }

  function deleteMember(idx) {
    if (!isAdmin) return;
    if (confirm(`በእርግጥ ${members[idx].name} ከዕቁብ ዝርዝር ይወገድ?`)) {
      members.splice(idx, 1);
      saveMembers();
    }
  }

  function renderTable() {
    const tbody = document.getElementById('members-body');
    tbody.innerHTML = '';
    
    if (members.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="color: #778da9; padding: 15px;">ምንም አባላት የሉም (በአድሚን ይጨመራሉ)</td></tr>`;
      return;
    }

    members.forEach((m, idx) => {
      let statusText = m.hasWon ? 'ዕጣ የወጣለት' : (m.days.every(d => d === true) ? 'ተከፍሏል' : 'አልተከፈለም');
      let statusColor = m.hasWon ? '#f5a623' : (m.days.every(d => d === true) ? '#2ec4b6' : '#e63946');

      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${m.name}</b></td>
        <td><small>${m.gender || 'ወንድ'}</small></td>
        ${m.days.map((d, dayIdx) => `<td><input type="checkbox" ${d ? 'checked' : ''} onchange="toggleDay(${idx}, ${dayIdx})" ${m.hasWon ? 'disabled' : ''}></td>`).join('')}
        <td><span style="color: ${statusColor}; font-weight: bold;">${statusText}</span></td>
        ${isAdmin ? `<td>
          <button class="btn-action btn-edit" onclick="editMember(${idx})">✏️</button>
          <button class="btn-action btn-delete" onclick="deleteMember(${idx})">🗑️</button>
        </td>` : ''}
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleDay(memberIdx, dayIdx) {
    if (!isAdmin) return;
    if (members[memberIdx].hasWon) return; // ዕጣ የወጣለት አባል አይቀየርም
    members[memberIdx].days[dayIdx] = !members[memberIdx].days[dayIdx];
    saveMembers();
  }

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const colors = ['#f5a623', '#3a86ff', '#2ec4b6', '#e63946', '#9d4edd', '#ff70a6', '#ff9f1c', '#70e000'];
  let startAngle = 0;

  function drawWheel() {
    // ዕጣ ያላጡ (የቀሩ) አባላትን ብቻ በጎማው ላይ ማሳየት
    const activeMembers = members.filter(m => !m.hasWon);
    if (activeMembers.length === 0) return;

    const numOptions = activeMembers.length;
    const arcSize = (2 * Math.PI) / numOptions;
    ctx.clearRect(0, 0, 280, 280);

    activeMembers.forEach((m, i) => {
      const angle = startAngle + i * arcSize;
      ctx.beginPath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(140, 140);
      ctx.arc(140, 140, 130, angle, angle + arcSize);
      ctx.lineTo(140, 140);
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#0d1b2a';
      ctx.stroke();

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.translate(140 + Math.cos(angle + arcSize / 2) * 85, 140 + Math.sin(angle + arcSize / 2) * 85);
      ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
      
      let fontSize = numOptions > 30 ? '9px' : (numOptions > 15 ? '11px' : '13px');
      ctx.font = `bold ${fontSize} sans-serif`;
      ctx.fillText(m.name, -ctx.measureText(m.name).width / 2, 0);
      ctx.restore();
    });
  }

  window.addEventListener('storage', (e) => {
    if (e.key === 'ky_spin_data') {
      const data = JSON.parse(e.newValue);
      startLiveSpin(data.targetAngle, data.winner, data.gender, data.winnerIdx);
    }
    if (e.key === 'ky_members') {
      members = JSON.parse(e.newValue);
      renderTable();
      drawWheel();
    }
  });

  function triggerSpin() {
    if (!isAdmin) return;
    if (members.length === 0) {
      alert("እባክዎን መጀመሪያ አባሎችን ያስገቡ!");
      return;
    }

    // ዕጣ ያላወጡ እና 5 ቀናት ክፍያ የሞሉ
    const eligibleMembers = members.filter(m => !m.hasWon && m.days.every(d => d === true));
    
    if (eligibleMembers.length === 0) {
      alert("⚠️ 5ቱንም ቀናት ክፍያ ያላጠናቀቁ ወይም ሁሉም ዕጣ ያወጡ ናቸው!");
      return;
    }

    const randomWinnerIndex = Math.floor(Math.random() * eligibleMembers.length);
    const winnerObj = eligibleMembers[randomWinnerIndex];
    
    const activeMembers = members.filter(m => !m.hasWon);
    const activeIndex = activeMembers.findIndex(m => m.name === winnerObj.name);
    const originalIndex = members.findIndex(m => m.name === winnerObj.name);

    const arcSize = 360 / activeMembers.length;
    const targetAngle = 360 * 8 + (360 - (activeIndex * arcSize + arcSize / 2));
    
    const spinData = {
      targetAngle: targetAngle,
      winner: winnerObj.name,
      gender: winnerObj.gender || 'ወንድ',
      winnerIdx: originalIndex,
      time: Date.now()
    };
    localStorage.setItem('ky_spin_data', JSON.stringify(spinData));
    startLiveSpin(targetAngle, winnerObj.name, winnerObj.gender || 'ወንድ', originalIndex);
  }

  function startLiveSpin(targetDegrees, winnerName, winnerGender, winnerIdx) {
    document.getElementById('wheel-box').style.display = 'block';
    document.getElementById('status-display').innerHTML = "🎲 ዕጣ በመውጣት ላይ ነው...";

    let currentDeg = 0;
    let spinDuration = 5000;
    let startTime = null;

    function step(timestamp) {
      if (!startTime) startTime = timestamp;
      let progress = timestamp - startTime;
      let ease = 1 - Math.pow(1 - Math.min(progress / spinDuration, 1), 4);
      currentDeg = targetDegrees * ease;
      
      startAngle = (currentDeg * Math.PI) / 180;
      drawWheel();

      if (progress < spinDuration) {
        requestAnimationFrame(step);
      } else {
        document.getElementById('status-display').innerHTML = `🎉 አሸናፊ፦ <b>${winnerName}</b> 🏆`;

        // 1. አሸናፊውን ዕጣ እንደወጣለት መመዝገብ እና 5ቱን ቀናት ባዶ (Reset) ማድረግ
        if (members[winnerIdx]) {
          members[winnerIdx].hasWon = true;
          members[winnerIdx].days = [false, false, false, false, false]; // ቲክ ባዶ ተደርጓል
          saveMembers();
        }

        if (isAdmin) {
          const congratMsg = (winnerGender === 'ሴት') ? "እንኳን ደስ አለሽ!" : "እንኳን ደስ አለህ!";
          
          currentShareText = `🎉 *K Y Digital Equb - Live Draw Result* 🎉\n\nየዚህ ዙር ዕጣ አሸናፊ:\n👤 የዚህ ዙር ዕጣ የወጣለት: *${winnerName}*\n💵 የዕቁብ ክፍያ መጠን: 50 ብር\n🏆 አጠቃላይ ድምር: 25,000 ብር\n\n💳 ለዕቁብ አባላት ብቻ የብድር አገልግሎት እንመቻቻለን::\n\n${congratMsg} 🎊 K Y Digital Equb`;
          
          document.getElementById('share-btn').style.display = 'block';
        }
      }
    }
    requestAnimationFrame(step);
  }

  function shareToTelegram(e) {
    e.preventDefault();
    if (!currentShareText) return;
    
    // በቴሌግራም አፕሊኬሽን ቀጥታ መላኪያ ድልድይ (tg://)
    const tgDirectUrl = `tg://msg_url?url=&text=${encodeURIComponent(currentShareText)}`;
    const tgWebUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(currentShareText)}`;

    // መጀመሪያ አፑን ይከፍታል ካልሆነ ድህረገጹን ይከፍታል
    window.location.href = tgDirectUrl;
    setTimeout(() => {
      window.open(tgWebUrl, '_blank');
    }, 1000);
  }

  renderTable();
  drawWheel();
</script>

</body>
</html>
