<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Y Digital Equb - Live ዕጣ ማውጫ</title>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --card-bg: #1b263b;
      --accent-color: #f5a623;
      --text-color: #e0e1dd;
      --success-color: #2ec4b6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      color: #3a86ff;
      margin-bottom: 5px;
      font-size: 26px;
    }

    .sub-title {
      color: #778da9;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .btn-spin {
      background-color: var(--success-color);
      color: #fff;
      font-size: 18px;
      margin-top: 15px;
    }

    .wheel-container {
      position: relative;
      margin: 15px auto;
      width: 260px;
      height: 260px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid var(--accent-color);
      z-index: 10;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #415a77;
      padding: 8px 4px;
      text-align: center;
    }

    th {
      background-color: #0d1b2a;
      color: var(--accent-color);
    }

    input[type="checkbox"] {
      transform: scale(1.2);
    }

    .user-readonly input[type="checkbox"] {
      pointer-events: none;
    }

    .winner-box {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 15px;
      padding: 10px;
      border: 1px dashed var(--accent-color);
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏆 K Y Digital Equb 🏆</h1>
  <div class="sub-title">የዕቁብ Live ዕጣ ማውጫ ገፅ</div>

  <!-- አድሚን መግቢያ ቁልፍ (በምስጢር የተያዘ - በድብቅ ቲክ ስትጫን አድሚን ሳጥን ይመጣል) -->
  <div class="card" style="padding: 8px;">
    <button class="btn" style="background-color: #1b263b; color: #778da9; font-size: 13px; padding: 6px;" onclick="secretAdminLogin()">🔑 አድሚን መግቢያ</button>
  </div>

  <!-- የዕጣ ማውጫ ቦታ -->
  <div class="card">
    <h3 style="color: #3a86ff; margin-top: 0;">🏆 የቀን (Live) ዕጣ ማውጣት</h3>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="260" height="260"></canvas>
    </div>
    
    <!-- Spin Button (አድሚን ሲገባ ብቻ ይወጣል) -->
    <div id="admin-spin-area" style="display: none;">
      <button class="btn btn-spin" onclick="triggerSpin()">🎲 ዕጣ አውጣ (Spin)</button>
    </div>

    <div id="winner-display" class="winner-box">አሸናፊ አልተመረጠም</div>
  </div>

  <!-- የአባላት ሰንጠረዥ -->
  <div class="card">
    <h3 style="color: #3a86ff; margin-top: 0;">የአባላት ዝርዝር እና የ 5 ቀናት ክፍያ (50 ብር)</h3>
    <div id="table-wrapper" class="user-readonly">
      <table>
        <thead>
          <tr>
            <th>ስም</th>
            <th>ቀን 1</th>
            <th>ቀን 2</th>
            <th>ቀን 3</th>
            <th>ቀን 4</th>
            <th>ቀን 5</th>
            <th>ሁኔታ</th>
          </tr>
        </thead>
        <tbody id="members-body">
          <!-- የአባላት ዝርዝር -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let isAdmin = false;

  function secretAdminLogin() {
    const pass = prompt("እባክዎን የአድሚን ይለፍ ቃል (Password) ያስገቡ:");
    if (pass === "182418") {
      isAdmin = true;
      document.getElementById('admin-spin-area').style.display = 'block';
      document.getElementById('table-wrapper').classList.remove('user-readonly');
      alert("በአድሚንነት በስኬት ገብተዋል!");
    } else {
      alert("የተሳሳተ ይለፍ ቃል!");
    }
  }

  const members = [
    { name: "ቃልአብ", days: [true, true, true, false, false], paid: true },
    { name: "ተማሪ 2", days: [true, true, false, false, false], paid: true },
    { name: "ተማሪ 3", days: [true, true, true, true, false], paid: true }
  ];

  function renderTable() {
    const tbody = document.getElementById('members-body');
    tbody.innerHTML = '';
    members.forEach((m, idx) => {
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${m.name}</b></td>
        ${m.days.map((d, dayIdx) => `<td><input type="checkbox" ${d ? 'checked' : ''} onchange="toggleDay(${idx},${dayIdx})"></td>`).join('')}
        <td><span style="color: ${m.paid ? '#2ec4b6' : '#e63946'}">${m.paid ? 'ተከፍሏል' : 'አልተከፈለም'}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleDay(memberIdx, dayIdx) {
    if (!isAdmin) return;
    members[memberIdx].days[dayIdx] = !members[memberIdx].days[dayIdx];
  }

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const colors = ['#f5a623', '#3a86ff', '#2ec4b6', '#e63946', '#9d4edd'];
  let startAngle = 0;

  function drawWheel(angleOffset = 0) {
    const numOptions = members.length;
    const arcSize = (2 * Math.PI) / numOptions;
    ctx.clearRect(0, 0, 260, 260);

    members.forEach((m, i) => {
      const angle = startAngle + angleOffset + i * arcSize;
      ctx.beginPath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(130, 130);
      ctx.arc(130, 130, 120, angle, angle + arcSize);
      ctx.lineTo(130, 130);
      ctx.fill();

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.translate(130 + Math.cos(angle + arcSize / 2) * 75, 130 + Math.sin(angle + arcSize / 2) * 75);
      ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(m.name, -ctx.measureText(m.name).width / 2, 0);
      ctx.restore();
    });
  }

  window.addEventListener('storage', (e) => {
    if (e.key === 'ky_spin_data') {
      const data = JSON.parse(e.newValue);
      animateSpinTo(data.targetAngle, data.winner);
    }
  });

  function triggerSpin() {
    if (!isAdmin) return;
    const randomWinnerIndex = Math.floor(Math.random() * members.length);
    const arcSize = 360 / members.length;
    const targetAngle = 360 * 5 + (360 - (randomWinnerIndex * arcSize + arcSize / 2));
    
    const spinData = {
      targetAngle: targetAngle,
      winner: members[randomWinnerIndex].name,
      time: Date.now()
    };
    localStorage.setItem('ky_spin_data', JSON.stringify(spinData));
    animateSpinTo(targetAngle, members[randomWinnerIndex].name);
  }

  function animateSpinTo(targetDegrees, winnerName) {
    let currentDeg = 0;
    let spinDuration = 4000;
    let startTime = null;

    function step(timestamp) {
      if (!startTime) startTime = timestamp;
      let progress = timestamp - startTime;
      let ease = 1 - Math.pow(1 - Math.min(progress / spinDuration, 1), 3);
      currentDeg = targetDegrees * ease;
      
      startAngle = (currentDeg * Math.PI) / 180;
      drawWheel();

      if (progress < spinDuration) {
        requestAnimationFrame(step);
      } else {
        document.getElementById('winner-display').innerHTML = `🎉 አሸናፊ፦ <b>${winnerName}</b> 🎉`;
      }
    }
    requestAnimationFrame(step);
  }

  drawWheel();
  renderTable();
</script>

</body>
</html>
