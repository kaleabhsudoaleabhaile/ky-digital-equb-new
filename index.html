<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K Y Digital Equb - Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏆 K Y Digital Equb 🏆</h1>
        <h3 id="waitingText">የዕቁብ Live እጣ ማውጫ ገጽ</h3>

        <!-- አድሚን መግቢያ እና መውጫ -->
        <div class="card" id="loginSection" style="text-align: center;">
            <button class="btn btn-primary" onclick="loginAdmin()">🔑 አድሚን በመሆን ግባ</button>
        </div>
        <div class="card" id="adminSection" style="display: none; text-align: center;">
            <button class="btn btn-danger" onclick="logoutAdmin()">🔒 ከአድሚን ውጣ</button>
        </div>

        <!-- አባል መመዝገቢያ (ለአድሚን ብቻ) -->
        <div class="card" id="addMemberCard" style="display: none;">
            <h3>አዲስ አባል መመዝገቢያ</h3>
            <input type="text" id="memberNameInput" placeholder="የአባል ስም ያስገቡ..." style="margin-bottom: 10px;">
            <select id="memberGenderInput" style="margin-bottom: 10px;">
                <option value="ወንድ">ወንድ</option>
                <option value="ሴት">ሴት</option>
            </select>
            <button class="btn btn-primary" onclick="addMember()">አባል ጨምር</button>
        </div>

        <!-- Live እጣ ማውጫ ክፍል -->
        <div class="card winner-card">
            <h3>🏆 የቀን (Live) ዕጣ ማውጣት</h3>
            <div id="winnerNameDisplay" class="winner-display">እጣ ለመጀመር ዝግጁ ነው</div>
            <button id="drawBtn" class="btn btn-draw" onclick="drawEqub()" style="background-color: #06b6d4; color: #000; font-weight: bold;">🔀 ዕጣ አውጣ!</button>
            
            <!-- የቴሌግራም ማጋሪያ ቁልፍ -->
            <div style="margin-top: 15px; text-align: center;">
                <a id="telegramShareBtn" href="#" target="_blank" class="btn btn-primary" style="display: none; background-color: #2481cc; color: white; text-decoration: none; padding: 10px; border-radius: 6px; display: inline-block;">
                    📤 ውጤቱን ወደ ቴሌግራም ቻናል ሼር አድርግ
                </a>
            </div>
        </div>

        <!-- አባላት ዝርዝር ሠንጠረዥ -->
        <div class="card">
            <h3>የአባላት ዝርዝር እና የ 5 ቀናት ክፍያ (50 ብር)</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ስም</th>
                            <th>ፆታ</th>
                            <th>መጠን</th>
                            <th>ቀን 1</th>
                            <th>ቀን 2</th>
                            <th>ቀን 3</th>
                            <th>ቀን 4</th>
                            <th>ቀን 5</th>
                            <th>ሁኔታ</th>
                            <th class="admin-col" style="display: none;">እርምጃ</th>
                        </tr>
                    </thead>
                    <tbody id="membersList">
                        <!-- አባላት በ JavaScript ይሞላሉ -->
                    </tbody>
                </table>
            </div>
            <p style="margin-top: 15px; text-align: center;">አጠቃላይ አባላት: <span id="totalMembersCount">0</span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
