<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K Y Digital Equb - Live ዕጣ ማውጫ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --card-bg: #1b263b;
      --accent-color: #f5a623;
      --text-color: #e0e1dd;
      --success-color: #2ec4b6;
      --button-bg: #0077b6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      color: #3a86ff;
      margin-bottom: 5px;
      font-size: 26px;
    }

    .sub-title {
      color: #778da9;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Admin Section */
    #admin-section {
      display: none; /* አድሚን ካልሆነ ይደበቃል */
      border: 2px solid var(--accent-color);
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .btn-spin {
      background-color: var(--success-color);
      color: #fff;
      font-size: 18px;
    }

    /* Wheel Canvas */
    .wheel-container {
      position: relative;
      margin: 20px auto;
      width: 280px;
      height: 280px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid var(--accent-color);
      z-index: 10;
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #415a77;
      padding: 8px 4px;
      text-align: center;
    }

    th {
      background-color: #0d1b2a;
      color: var(--accent-color);
    }

    input[type="checkbox"] {
      transform: scale(1.2);
    }

    /* Readonly for users */
    .user-readonly input[type="checkbox"] {
      pointer-events: none; /* ተጠቃሚዎች ቲክ እንዳያደርጉ ይከለክላል */
      opacity: 0.8;
    }

    .winner-box {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 10px;
      padding: 10px;
      border: 1px dashed var(--accent-color);
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏆 K Y Digital Equb 🏆</h1>
  <div class="sub-title">የዕቁብ Live ዕጣ ማውጫ ገፅ</div>

  <!-- አድሚን ብቻ የሚያየው ክፍል -->
  <div id="admin-login-card" class="card" style="display: none;">
    <button class="btn" onclick="toggleAdminAuth()">🔑 አድሚን በመሆን ግባ</button>
  </div>

  <div id="admin-panel" class="card" style="display: none;">
    <h3 style="color: var(--accent-color); margin: 0 0 10px 0;">⚙️ የአድሚን መቆጣጠሪያ</h3>
    <button class="btn btn-spin" onclick="spinWheel()">🎲 ዕጣ አውጣ (Spin)</button>
  </div>

  <!-- የዕጣ ማውጫ ቦታ (ሁሉም የሚያየው) -->
  <div class="card">
    <h3 style="color: #3a86ff; margin-top: 0;">🏆 የቀን (Live) ዕጣ ማውጣት</h3>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="280" height="280"></canvas>
    </div>
    <div id="winner-display" class="winner-box">አሸናፊ አልተመረጠም</div>
  </div>

  <!-- የአባላት ሰንጠረዥ -->
  <div class="card">
    <h3 style="color: #3a86ff; margin-top: 0;">የአባላት ዝርዝር እና የ 5 ቀናት ክፍያ (50 ብር)</h3>
    <div id="table-wrapper" class="user-readonly">
      <table>
        <thead>
          <tr>
            <th>ስም</th>
            <th>ቀን 1</th>
            <th>ቀን 2</th>
            <th>ቀን 3</th>
            <th>ቀን 4</th>
            <th>ቀን 5</th>
            <th>ሁኔታ</th>
          </tr>
        </thead>
        <tbody id="members-body">
          <!-- የአባላት ዝርዝር በ JS ይጫናል -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // የአድሚን ID
  const ADMIN_ID = "8833060672"; 
  let isAdmin = false;

  // የቴሌግራም WebApp መረጃ ማረጋገጥ
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.expand();
    const currentUser = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
    if (currentUser && String(currentUser.id) === ADMIN_ID) {
      document.getElementById('admin-login-card').style.display = 'block';
    }
  } else {
    // ለቴሌግራም ውጭ ሙከራ
    document.getElementById('admin-login-card').style.display = 'block';
  }

  function toggleAdminAuth() {
    const pass = prompt("እባክዎን የአድሚን ይለፍ ቃል (Password) ያስገቡ:");
    if (pass === "1234" || pass === "admin") { // የራስህን ፓስወርድ እዚህ መቀየር ትችላለህ
      isAdmin = true;
      document.getElementById('admin-panel').style.display = 'block';
      document.getElementById('admin-login-card').style.display = 'none';
      document.getElementById('table-wrapper').classList.remove('user-readonly');
      alert("በአድሚንነት ገብተዋል!");
    } else {
      alert("የተሳሳተ ይለፍ ቃል!");
    }
  }

  // የአባላት ናሙና መረጃ
  const members = [
    { name: "ቃልአብ", days: [true, true, true, false, false], paid: true },
    { name: "ተማሪ 2", days: [true, true, false, false, false], paid: true },
    { name: "ተማሪ 3", days: [true, true, true, true, false], paid: true }
  ];

  function renderTable() {
    const tbody = document.getElementById('members-body');
    tbody.innerHTML = '';
    members.forEach((m, idx) => {
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${m.name}</b></td>
        ${m.days.map((d, dayIdx) => `<td><input type="checkbox" ${d ? 'checked' : ''} onchange="toggleDay(${idx},${dayIdx})"></td>`).join('')}
        <td><span style="color: ${m.paid ? '#2ec4b6' : '#e63946'}">${m.paid ? 'ተከፍሏል' : 'አልተከፈለም'}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleDay(memberIdx, dayIdx) {
    if (!isAdmin) return;
    members[memberIdx].days[dayIdx] = !members[memberIdx].days[dayIdx];
  }

  // የጎማ (Spin Wheel) አሰራር
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const colors = ['#f5a623', '#3a86ff', '#2ec4b6', '#e63946', '#9d4edd'];
  let startAngle = 0;

  function drawWheel() {
    const numOptions = members.length;
    const arcSize = (2 * Math.PI) / numOptions;
    ctx.clearRect(0, 0, 280, 280);

    members.forEach((m, i) => {
      const angle = startAngle + i * arcSize;
      ctx.beginPath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(140, 140);
      ctx.arc(140, 140, 130, angle, angle + arcSize);
      ctx.lineTo(140, 140);
      ctx.fill();

      // Text
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.translate(140 + Math.cos(angle + arcSize / 2) * 80, 140 + Math.sin(angle + arcSize / 2) * 80);
      ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(m.name, -ctx.measureText(m.name).width / 2, 0);
      ctx.restore();
    });
  }

  function spinWheel() {
    if (!isAdmin) return;
    let spinAngleStart = Math.random() * 10 + 10;
    let spinTime = 0;
    let spinTimeTotal = Math.random() * 3000 + 4000;

    function rotate() {
      spinTime += 30;
      if (spinTime >= spinTimeTotal) {
        stopRotate();
        return;
      }
      const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
      startAngle += (spinAngle * Math.PI / 180);
      drawWheel();
      requestAnimationFrame(rotate);
    }

    function stopRotate() {
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcr = 360 / members.length;
      const index = Math.floor((360 - (degrees % 360)) / arcr) % members.length;
      document.getElementById('winner-display').innerHTML = `🎉 አሸናፊ፦ <b>${members[index].name}</b> 🎉`;
    }

    rotate();
  }

  function easeOut(t, b, c, d) {
    const ts = (t /= d) * t;
    const tc = ts * t;
    return b + c * (tc + -3 * ts + 3 * t);
  }

  drawWheel();
  renderTable();
</script>

</body>
</html>
